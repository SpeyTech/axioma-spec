# Stage 1 CI (proposed; owner-approved approach 2026-10-12). Isolated branch only.
# Third-party actions are pinned by full commit SHA. No secrets are used.
# Every checkout sets persist-credentials: false; no job needs git credentials
# after checkout (no push, no authenticated fetch).
name: stage1-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  substrate-and-vectors:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-release,   os: ubuntu-24.04,     cc: gcc,   type: Release, san: "" }
          - { name: clang-release, os: ubuntu-24.04,     cc: clang, type: Release, san: "" }
          - { name: asan-ubsan,    os: ubuntu-24.04,     cc: gcc,   type: Debug,   san: "-fsanitize=address,undefined -fno-sanitize-recover=all" }
          - { name: arm64-gcc,     os: ubuntu-24.04-arm, cc: gcc,   type: Release, san: "" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: estate/axioma-spec
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake clang
          ${{ matrix.cc }} --version | head -1; uname -m
      - name: Build SHA-256 substrate
        run: |
          SAN="${{ matrix.san }}"
          cmake -S estate/axioma-spec -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
                -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_FLAGS="$SAN"
          cmake --build build -j
      - name: SRS-007-AMD-001 vectors reproduce byte for byte (both reference implementations)
        run: |
          cd estate/axioma-spec/docs/requirements/SRS-007-AMD-001-vectors
          SAN="${{ matrix.san }}"
          python3 -I reference-python/merkle_v2.py | cmp - vectors.txt
          # v0.2 continuity: the v0.1 implementations still reproduce the v0.2 set,
          # and the v0.3 set keeps those 65 lines byte-identical.
          python3 -I reference-python/v0.1/merkle_v2.py | cmp - vectors-v0.2.txt
          python3 reference-python/v0.1/selftest.py
          head -65 vectors.txt | cmp - vectors-v0.2.txt
          ${{ matrix.cc }} -std=c99 -Wall -Wextra -Werror -pedantic -O2 $SAN reference-c/merkle_v2.c -o "$RUNNER_TEMP/mv2"
          "$RUNNER_TEMP/mv2" | cmp - vectors.txt
          echo "FINGERPRINT axioma-spec ${{ matrix.name }} $(uname -m) $(sha256sum vectors.txt | cut -d' ' -f1)"
      - name: SRS-004-AMD-002 (AX:OBS:v2 draft) vectors reproduce byte for byte (both reference implementations)
        run: |
          cd estate/axioma-spec/docs/requirements/SRS-004-AMD-002-vectors
          SAN="${{ matrix.san }}"
          python3 -I reference-python/obs_v2.py | cmp - vectors.txt
          ${{ matrix.cc }} -std=c99 -Wall -Wextra -Werror -pedantic -O2 $SAN reference-c/obs_v2.c -o "$RUNNER_TEMP/obs2"
          "$RUNNER_TEMP/obs2" | cmp - vectors.txt
          # v0.1 continuity: the v0.1 implementations still reproduce the v0.1 set
          python3 -I reference-python/v0.1/obs_v2.py | cmp - vectors-v0.1.txt
          ${{ matrix.cc }} -std=c99 -O2 $SAN reference-c/v0.1/obs_v2.c -o "$RUNNER_TEMP/obs21"
          "$RUNNER_TEMP/obs21" | cmp - vectors-v0.1.txt
          echo "FINGERPRINT axioma-spec-obs-v2 ${{ matrix.name }} $(uname -m) $(sha256sum vectors.txt | cut -d' ' -f1)"
      - name: SRS-004-AMD-002 NFC targeted vectors reproduce against Unicode 16.0.0 reference
        # x86_64 only: unicodedata2 16.0.0 publishes no aarch64 wheel, and the
        # reference is not built from source in CI. The vectors are data, so
        # architecture identity is not at issue here.
        if: runner.arch == 'X64'
        run: |
          python3 -m venv "$RUNNER_TEMP/ud2"
          "$RUNNER_TEMP/ud2/bin/pip" install -q --only-binary :all: unicodedata2==16.0.0
          cd estate/axioma-spec/docs/requirements/SRS-004-AMD-002-vectors/nfc
          "$RUNNER_TEMP/ud2/bin/python" -I nfc_reference.py | cmp - nfc-targeted-u16.txt
